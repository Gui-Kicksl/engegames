<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Engegames</title>
</head>
<body>
  <p id="categoria"></p>
  <h1 id="enunciado"></h1>
  <pre id="codigo"></pre>

  <button id="alt0"></button>
  <button id="alt1"></button>
  <button id="alt2"></button>
  <button id="alt3"></button>

  <h2 id="veredito"></h2>
  <p id="explicacao"></p>

  <script>
    const PARTIDA = "11111111-1111-1111-1111-111111111111";

    async function carregarCarta() {
      const resposta = await fetch("/api/partidas/" + PARTIDA + "/carta/");
      const dados = await resposta.json();

      document.getElementById("categoria").textContent = dados.categoria;
      document.getElementById("enunciado").textContent = dados.enunciado;
      document.getElementById("codigo").textContent = dados.codigo;

      document.getElementById("alt0").textContent = dados.alternativas[0];
      document.getElementById("alt1").textContent = dados.alternativas[1];
      document.getElementById("alt2").textContent = dados.alternativas[2];
      document.getElementById("alt3").textContent = dados.alternativas[3];
    }

    async function responder(escolha) {
      const resposta = await fetch("/api/partidas/" + PARTIDA + "/resposta/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ escolha: escolha })
      });
      const julgamento = await resposta.json();

      if (julgamento.certa) {
        document.getElementById("veredito").textContent = "Acertou!";
      } else {
        document.getElementById("veredito").textContent = "Errou.";
      }

      document.getElementById("explicacao").textContent = julgamento.explicacao;
    }

    document.getElementById("alt0").addEventListener("click", function () { responder(0); });
    document.getElementById("alt1").addEventListener("click", function () { responder(1); });
    document.getElementById("alt2").addEventListener("click", function () { responder(2); });
    document.getElementById("alt3").addEventListener("click", function () { responder(3); });

    carregarCarta();
  </script>
</body>
</html>
