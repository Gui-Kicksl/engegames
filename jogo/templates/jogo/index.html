<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Engegames</title>
</head>
<body>
  <h1 id="titulo">carregando...</h1>
  <pre id="resultado"></pre>

  <script>
    async function carregarCarta() {
      const resposta = await fetch("/api/partidas/11111111-1111-1111-1111-111111111111/carta/");
      const dados = await resposta.json();

      document.getElementById("titulo").textContent = dados.enunciado;
      document.getElementById("resultado").textContent = JSON.stringify(dados, null, 2);
    }

    carregarCarta();
  </script>
</body>
</html>
